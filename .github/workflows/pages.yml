# The demo: the site built for https://stijn.github.io/belgian-motorsport/ on every push to main.
# It carries a preview bar, a noindex tag and a switched-off contact form (PUBLIC_DEMO=1). The real
# site goes to Cloudflare from the same code, without these flags (docs/go-live.md).
name: Demo on GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE: https://stijn.github.io
      BASE: /belgian-motorsport
      PUBLIC_DEMO: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
